<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f5d2a">
<title>도토리 펑</title>
<meta name="description" content="다람쥐 도담이 도토리 폭탄으로 덤불 미로를 뚫는 칸 단위 폭탄 미로 게임">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <section id="scr-title" class="screen on" aria-label="첫 화면">
    <canvas id="logo" width="320" height="150" aria-hidden="true"></canvas>
    <h1>도토리 펑</h1>
    <p class="lead">다람쥐 <b>도담</b>이 도토리 폭탄으로 덤불 미로를 뚫고, 다섯 고장의 대장을 물리쳐 숲의 씨앗을 되찾는 이야기</p>
    <div class="menu">
      <button id="btn-continue" class="big">모험 시작</button>
      <button id="btn-map">판 고르기</button>
      <button id="btn-vs">둘이서 대전</button>
      <button id="btn-help">하는 법</button>
      <button id="btn-sound" aria-pressed="true">소리 켜짐</button>
    </div>
    <p class="small">판 35개 · 월드 5개 · 월드마다 대장 · 진행은 이 기기에 저장</p>
  </section>

  <section id="scr-map" class="screen" aria-label="판 고르기">
    <div class="row top"><button class="back" data-go="title">← 처음으로</button><h2>판 고르기</h2></div>
    <div id="world-tabs" class="tabs" role="tablist"></div>
    <p id="world-desc" class="small"></p>
    <div id="stage-grid" class="stages"></div>
  </section>

  <section id="scr-vs" class="screen" aria-label="대전 설정">
    <div class="row top"><button class="back" data-go="title">← 처음으로</button><h2>둘이서 대전</h2></div>
    <p class="small">한 화면에서 마지막까지 남는 쪽이 이깁니다. 시간이 1분 남으면 바위가 바깥부터 조여 옵니다.</p>
    <div class="form">
      <label>1P <span class="tag">도담 · 키보드 W A S D + 스페이스 · 1번 패드 · 터치</span></label>
      <label for="vs-p2">2P (보리)</label>
      <select id="vs-p2"><option value="human">사람 — 방향키 + 엔터 · 2번 패드</option><option value="cpu">컴퓨터</option></select>
      <label for="vs-level">컴퓨터 실력</label>
      <select id="vs-level"><option value="0">새싹</option><option value="1">보통</option><option value="2">잘함</option><option value="3">고수</option></select>
      <label for="vs-p3">3P (달래)</label>
      <select id="vs-p3"><option value="none">없음</option><option value="cpu">컴퓨터</option></select>
      <label for="vs-p4">4P (먹쇠)</label>
      <select id="vs-p4"><option value="none">없음</option><option value="cpu">컴퓨터</option></select>
      <label for="vs-rounds">판 수</label>
      <select id="vs-rounds"><option value="1">한 판</option><option value="3">세 판 두 번 먼저</option><option value="5">다섯 판 세 번 먼저</option></select>
    </div>
    <button id="btn-vs-start" class="big">대전 시작</button>
  </section>

  <section id="scr-help" class="screen" aria-label="하는 법">
    <div class="row top"><button class="back" data-go="title">← 처음으로</button><h2>하는 법</h2></div>
    <div id="help-body" class="help"></div>
  </section>

  <section id="scr-game" class="screen" aria-label="게임">
    <div id="hud" class="hud"></div>
    <div class="stage-wrap"><canvas id="cv" width="480" height="416" aria-label="게임 화면"></canvas>
      <div id="overlay" class="overlay" hidden></div>
    </div>
    <div id="touch" class="touch">
      <div id="dpad" class="dpad" aria-label="방향 패드">
        <span data-dir="0,-1" class="u">▲</span><span data-dir="-1,0" class="l">◀</span><span data-dir="1,0" class="r">▶</span><span data-dir="0,1" class="d">▼</span>
      </div>
      <button id="btn-pause" class="pause" aria-label="멈춤">Ⅱ</button>
      <button id="btn-bomb" class="bomb" aria-label="도토리 놓기">도토리</button>
    </div>
  </section>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
